{% extends "base.html" %}
{% block title %}Login - MindMeter AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="fw-bold mb-2">Student Login</h3>
      <p class="text-muted small mb-4">Enter your academic credentials</p>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="alex.rivera@university.edu">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
      </form>

      <div class="text-center mt-3 small">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
